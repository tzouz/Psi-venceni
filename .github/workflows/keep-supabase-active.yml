name: Keep Supabase project active

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-active:
    runs-on: ubuntu-latest
    steps:
      - name: Send a lightweight database request
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Repository variables SUPABASE_URL and SUPABASE_ANON_KEY must be configured."
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/groups?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Accept: application/json" \
            -o /dev/null
          echo "Supabase API request completed successfully."
